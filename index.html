<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0d0f12;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* MÀN HÌNH CHÀO MỪNG (WELCOME OVERLAY) */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #welcome-screen h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }

    #welcome-screen p {
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.98); }
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Video Nền */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.5);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: -1;
    }

    /* Card Profile Main */
    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 25px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      margin: 20px 0;
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px auto;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6c5ce7;
      box-shadow: 0 0 15px rgba(108, 92, 231, 0.5);
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: center;
    }

    .typewriter {
      color: #a29bfe;
      border-right: 2px solid #a29bfe;
      white-space: nowrap;
      animation: blink 0.7s infinite;
    }

    @keyframes blink { 50% { border-color: transparent; } }

    .badges, .tech-stack {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }

    .bio {
      font-size: 13px;
      color: #ccc;
      margin: 15px 0;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .social-btn:hover {
      background: #6c5ce7;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHÀO MỪNG -->
  <div id="welcome-screen">
    <h1>[ CLICK TO ENTER ]</h1>
    <p>Nhấp vào bất kỳ đâu để tiếp tục</p>
  </div>

  <!-- BG VIDEO -->
  <video id="my-video" class="bg-video" loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-1610-large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- PROFILE CARD -->
  <div class="profile-card">
    <div class="avatar-wrapper">
      <img src="https://via.placeholder.com/150" alt="Avatar">
    </div>

    <div class="title">
      <span class="typewriter" id="typewriter-text"></span>
    </div>

    <div class="badges">
      <i class="fa-solid fa-code" style="color: #00cec9;"></i>
      <i class="fa-solid fa-heart" style="color: #ff7675;"></i>
      <i class="fa-solid fa-music" style="color: #a29bfe;"></i>
      <i class="fa-solid fa-circle-check" style="color: #74b9ff;"></i>
    </div>

    <div class="tech-stack">
      <i class="fa-brands fa-python" style="color: #ffeaa7;"></i>
      <i class="fa-brands fa-html5" style="color: #e17055;"></i>
      <i class="fa-brands fa-css3-alt" style="color: #0984e3;"></i>
      <i class="fa-brands fa-js" style="color: #fdcb6e;"></i>
    </div>

    <div class="bio">
      Le Thinh Media - Support Dv Mxh<br>Dev / Tricker Facebook TikTok
    </div>

    <div class="social-links">
      <a href="#" class="social-btn"><i class="fa-solid fa-comment"></i></a>
      <a href="#" class="social-btn"><i class="fa-brands fa-tiktok"></i></a>
      <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
    </div>
  </div>

  <script>
    // Xử lý sự kiện click Welcome
    const welcomeScreen = document.getElementById('welcome-screen');
    const bgVideo = document.getElementById('my-video');

    welcomeScreen.addEventListener('click', () => {
      welcomeScreen.classList.add('fade-out');
      bgVideo.play(); // Bật video/âm thanh ngay khi người dùng tương tác
      setTimeout(type, 800); // Chờ ẩn màn chào mừng mới chạy gõ chữ
    });

    // Code gõ chữ Typewriter
    const textArray = ["Le Thinh Media", "Support Dv Mxh", "Developer"];
    let index = 0, charIndex = 0;
    const typewriterElement = document.getElementById("typewriter-text");

    function type() {
      if (charIndex < textArray[index].length) {
        typewriterElement.textContent += textArray[index].charAt(charIndex);
        charIndex++;
        setTimeout(type, 100);
      } else {
        setTimeout(erase, 1500);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typewriterElement.textContent = textArray[index].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, 50);
      } else {
        index = (index + 1) % textArray.length;
        setTimeout(type, 100);
      }
    }
  </script>
</body>
</html>
