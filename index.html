<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0d0f12;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* POPUP TERMINAL WELCOME OVERLAY */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Cửa sổ phong cách macOS Window */
    .terminal-window {
      width: 90%;
      max-width: 380px;
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .terminal-header {
      background: #2d2d2d;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .terminal-body {
      padding: 20px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.2;
      color: #e0e0e0;
      text-align: center;
      white-space: pre;
    }

    .ascii-art {
      display: inline-block;
      text-align: left;
      color: #fff;
      font-weight: bold;
    }

    .terminal-info {
      margin-top: 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }

    .press-continue {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Video Nền */
    .bg-video {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; filter: brightness(0.5);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: -1;
    }

    /* Profile Card Main */
    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: 30px 25px;
      width: 90%; max-width: 420px; text-align: center;
      backdrop-filter: blur(15px);
    }
  </style>
</head>
<body>

  <div id="welcome-screen">
    <div class="terminal-window">
      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="terminal-body">
        <div class="ascii-art" id="ascii-container"></div>
        
        <div class="terminal-info" id="info-container" style="display: none;">
          <div>Mở trên web <i>để tránh bị lỗi!</i></div>
          <div style="margin-top: 5px;">IP: <span id="ip-address">Đang tải...</span></div>
          <div>System: <span id="user-system">Loading...</span></div>
          <div>Bio Loaded</div>
          <div class="press-continue">Press Enter/Click To Continue</div>
        </div>
      </div>
    </div>
  </div>

  <video id="my-video" class="bg-video" loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-1610-large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="profile-card">
    <h2>Le Thinh Media</h2>
    <p>Support Dv Mxh</p>
  </div>

  <script>
    // Mã ASCII vẽ con mèo 
    const asciiCat = [
      "┌─┐┌─┐┬  ┬┬─┐┌─┐┬─┐┬─┐┬─┐",
      "│  ├─┤│  │├┬┘├─┤├┬┘├┬┘├┬┘",
      "└─┘┴ ┴┴─┘┴┴└─┴ ┴┴└─┴└─┴└─",
      "   /\\_/\\  ",
      "  ( o.o ) ",
      "   > ^ <  ",
      " ฅ^•ﻌ•^ฅ "
    ];

    const asciiContainer = document.getElementById("ascii-container");
    const infoContainer = document.getElementById("info-container");
    let lineIndex = 0;

    // Chạy render từng dòng ASCII con mèo
    function printAscii() {
      if (lineIndex < asciiCat.length) {
        asciiContainer.innerHTML += asciiCat[lineIndex] + "\n";
        lineIndex++;
        setTimeout(printAscii, 120); // Tốc độ xuất hiện từng dòng
      } else {
        // Render xong con mèo thì hiện thông tin bên dưới
        infoContainer.style.display = "block";
      }
    }

    // Tự động nhận diện thiết bị & Lấy địa chỉ IP thật
    function getSystemInfo() {
      // Nhận diện OS
      const userAgent = navigator.userAgent;
      let os = "Unknown OS";
      if (userAgent.indexOf("iPhone") !== -1 || userAgent.indexOf("iPad") !== -1) os = "iOS";
      else if (userAgent.indexOf("Android") !== -1) os = "Android";
      else if (userAgent.indexOf("Windows") !== -1) os = "Windows PC";
      else if (userAgent.indexOf("Mac") !== -1) os = "macOS";
      document.getElementById("user-system").textContent = os;

      // Lấy IP từ API
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => {
          document.getElementById("ip-address").textContent = data.ip;
        })
        .catch(() => {
          document.getElementById("ip-address").textContent = "127.0.0.1";
        });
    }

    // Xử lý sự kiện Click để vào web
    const welcomeScreen = document.getElementById('welcome-screen');
    const bgVideo = document.getElementById('my-video');

    welcomeScreen.addEventListener('click', () => {
      welcomeScreen.classList.add('fade-out');
      bgVideo.play();
    });

    // Chạy script khi tải trang
    document.addEventListener("DOMContentLoaded", () => {
      printAscii();
      getSystemInfo();
    });
  </script>
</body>
</html>
