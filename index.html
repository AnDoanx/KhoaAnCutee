<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* MÀN HÌNH TERMINAL OVERLAY */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .terminal-window {
      width: 90%;
      max-width: 360px;
      background: #181818;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .terminal-header {
      background: #252525;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .terminal-body {
      padding: 20px 15px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.15;
      color: #e0e0e0;
      text-align: center;
    }

    .braille-art {
      white-space: pre;
      display: inline-block;
      text-align: left;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .terminal-text {
      margin-top: 15px;
      font-size: 12px;
      line-height: 1.6;
      min-height: 120px;
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* BACKGROUND VIDEO & MAIN CARD */
    .bg-video {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; filter: brightness(0.5);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: -1;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: 30px 25px;
      width: 90%; max-width: 400px; text-align: center;
      backdrop-filter: blur(15px);
    }
  </style>
</head>
<body>

  <div id="welcome-screen">
    <div class="terminal-window">
      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="terminal-body">
        <div class="braille-art" id="braille-container"></div>
        
        <div class="terminal-text" id="text-container"></div>
      </div>
    </div>
  </div>

  <video id="my-video" class="bg-video" loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-1610-large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="profile-card">
    <h2>Anime & Coding</h2>
    <p>Le Thinh Media - Support Dv Mxh</p>
  </div>

  <script>
    // Bức ảnh Braille chuẩn theo video
    const brailleLines = [
      "⡏⠉⠉⠉⠉⢹⢏⠉⠉⠉⠉⢹⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿",
      "⡇⠄⠂⠁⡏⢠⣤⣄⠄⢹⣿⣿⣿⣿⠿⠿⠉⠉⠉⢹",
      "⣿⣦⡀⠌⣴⣿⣿⣿⡏⢄⣀⣀⣀⣤⣴⣿⣿⣿⡇",
      "⣿⣿⡿⢠⣿⣿⣿⡿⠁⢾⣿⡏⢠⣾⣿⣿⣿⣿⣿⡇⠄",
      "⡿⡿⢠⡿⠿⠿⠿⣿⣷⣌⣹⣿⣶⣾⣿⣿⣿⣿⣿⠁⠹",
      "⡇⢿⣿⠁⠄⠙⣿⡿⠿⠿⣿⣏⠿⠿⠿⠿⢿⣿⣿⠄⣿",
      "⠈⣾⣿⣄⣴⣾⣿⣷⣶⣶⣴⣷⠄⠤⠤⢿⣿⣿⣷⠄⠁",
      "⠄⡿⠁⠄⠄⠄⠙⠿⠉⠄⠄⢴⣷⣶⣾⣿⣿⣿⣷⠄",
      "⣸⠄⢠⣀⠄⠄⠄⠄⠄⠄⣀⣀⣈⡉⠿⣿⣿⣿⣶⠉⣄",
      "⡏⣿⣿⣿⠄⢠⠄⠄⠄⠄⣿⣿⣿⣿⣶⣌⡹⢏⠹⠁⢹",
      "⢸⢸⣿⣿⠁⠄⠄⠄⡀⠄⠹⠿⢿⣿⣿⣿⣿⣷⣄⢴⣿",
      "⣷⢠⠻⠿⠁⠄⠄⠄⠄⠄⠄⠈⠙⠿⣿⣿⣿⣿⣿⣷⠙"
    ];

    const brailleContainer = document.getElementById("braille-container");
    const textContainer = document.getElementById("text-container");

    let lineIdx = 0;

    // 1. Chạy xuất hiện từng dòng ảnh Braille
    function renderBraille() {
      if (lineIdx < brailleLines.length) {
        brailleContainer.innerHTML += brailleLines[lineIdx] + "\n";
        lineIdx++;
        setTimeout(renderBraille, 80); // Tốc độ rơi từng dòng ảnh
      } else {
        // Sau khi vẽ xong ảnh thì chuyển sang gõ chữ thông tin
        setTimeout(typeTextInfo, 300);
      }
    }

    // 2. Nội dung các dòng chữ bên dưới
    const textLines = [
      "Mở trên web để tránh bị lỗi!",
      "IP: 27.79.120.174",
      "System: iOS 18.6",
      "Bio Loaded",
      "Press Enter/Click To Continue"
    ];

    let currentLine = 0;
    let currentChar = 0;

    // Chạy hiệu ứng gõ từng ký tự từng dòng
    function typeTextInfo() {
      if (currentLine < textLines.length) {
        if (currentChar === 0) {
          textContainer.innerHTML += "<div id='line-" + currentLine + "'></div>";
        }
        
        let lineElement = document.getElementById('line-' + currentLine);
        lineElement.textContent += textLines[currentLine].charAt(currentChar);
        currentChar++;

        if (currentChar < textLines[currentLine].length) {
          setTimeout(typeTextInfo, 40); // Tốc độ gõ ký tự
        } else {
          currentLine++;
          currentChar = 0;
          setTimeout(typeTextInfo, 150); // Khoảng nghỉ giữa các dòng
        }
      }
    }

    // Sự kiện Click vào Terminal để chuyển sang Web
    const welcomeScreen = document.getElementById('welcome-screen');
    const bgVideo = document.getElementById('my-video');

    welcomeScreen.addEventListener('click', () => {
      welcomeScreen.classList.add('fade-out');
      bgVideo.play();
    });

    // Chạy hiệu ứng khi tải trang
    document.addEventListener("DOMContentLoaded", renderBraille);
  </script>
</body>
</html>
